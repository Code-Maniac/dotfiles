# rebind prefix to ctrl-a from ctrl-b - actually capslock-a
set -g prefix C-a
unbind C-b

# allow tmux to set the titlebar
set -g set-titles on

# remove escape delay
set -s escape-time 1

# set the default shell to zsh
set-option -g default-shell /bin/zsh

# # set indexes
set -g base-index 1
setw -g pane-base-index 1

# # C-a-r to reload this file
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# # force tmux to use 256 colors
#set -g default-terminal "xterm-256color"
set -g default-terminal "screen-256color"

#set high scrollback buffer size
set -g history-limit 10000

#auto renumber windows
set-option -g renumber-windows on

# creating new splits
unbind %
unbind :
unbind c

# Splits and new windows follow a pane into its container. When the pane has
# published one (zsh/docker.zsh sets @pane_container from inside), the new pane
# re-enters that container at the same directory; otherwise this is the ordinary
# host split at the pane's current path.
bind | if-shell -F '#{@pane_container}' \
    'run-shell "~/.dotfiles/tmux/docker-split -h"' \
    'split-window -h -c "#{pane_current_path}"'
bind - if-shell -F '#{@pane_container}' \
    'run-shell "~/.dotfiles/tmux/docker-split -v"' \
    'split-window -v -c "#{pane_current_path}"'
bind c if-shell -F '#{@pane_container}' \
    'run-shell "~/.dotfiles/tmux/docker-split -w"' \
    'new-window -c "#{pane_current_path}"'

# pane swapping that works seemlessly with vim panes
#
# Two tests, in order of trust.
#
# @is_vim is published by nvim itself - see vim/astronvim/lua/plugins/
# tmux-navigator.lua, which sets it on entry and clears it on exit. It is what
# makes this work for a pane running nvim inside a container: the ps test below
# asks the host kernel what is on the pane's tty, and nvim in a container lives
# in another pid namespace with its controlling terminal on the container side of
# the docker exec stream, so the host only ever sees `docker` there. Publishing
# the fact from inside sidesteps the namespace entirely - the container has the
# tmux binary and inherits $TMUX, so it can set a pane option on this server.
#
# The ps test stays as the fallback for host panes, so one running vim, view or
# vimdiff still works without any cooperation from the editor. It is skipped
# entirely for container panes, and not just because it cannot see in: it
# actively lies about them.
#
# `ps -t` matches on the tty's device number, and a container has its own devpts
# instance numbering ptys from scratch, so container pts/N and host pts/N are the
# same major:minor - 136:3 for both, verifiably. The host process list contains
# the container's processes too, filed under a tty name it cannot attribute
# correctly, so an nvim open in *any* container pane makes the scrape match for
# whichever host pane drew the colliding number. The symptom is a pane running
# something else entirely - a shell, claude - silently swallowing C-hjkl, and it
# comes and goes as panes open and close and the numbers stop lining up.
#
# So the scrape is filtered to this pid namespace. ps exposes the namespace inode
# as a column, which keeps it to the one call it always was rather than a fork
# per process on every keypress. Container processes on a colliding pts number
# are then simply not there to match.
#
# The host inode is substituted straight into awk's -v rather than parked in a
# shell variable first. tmux expands $name inside a double-quoted config string,
# so a `$h` here is eaten by tmux and awk is handed h="" - which matches nothing,
# and quietly turns the whole fallback off instead of erroring. $( and $$ survive
# because neither is a variable name. Keep shell variables out of this string.
#
# This has to be the filter rather than a "skip container panes" guard, because
# the pollution is not confined to them: a host pane's tty routinely carries a
# container's processes as well, so a container nvim can break a host pane that
# has nothing to do with docker.
#
# @pane_container stays as a cheap early exit above - when it is set the pane is
# certainly a container one. It cannot be relied on alone: zsh/docker.zsh
# publishes it from a precmd hook and clears it whenever a host shell prompts in
# the pane, so a pane sitting in a long-running foreground process like claude
# stops advertising one and the guard silently stops applying. The namespace
# filter is what actually holds when that happens.
#
# Caveat: if nvim dies without running its VimLeave autocmd, @is_vim is left set
# and that pane keeps forwarding the keys. Clear it with
#   tmux set -p -t <pane> -u @is_vim
# When @is_vim is set at all it is authoritative, including when it says no:
# nvim publishes yes only in the modes where it actually has C-hjkl bound, which
# is normal and terminal. In insert or visual it publishes no, and tmux switches
# the pane itself. That matters because a forwarded C-j reaches insert mode as a
# plain LF and puts a line break in the file - the key is not just ignored there,
# it edits the buffer.
is_vim="if [ -n '#{@is_vim}' ]; then [ '#{@is_vim}' = 'yes' ]; \
    elif [ -n '#{@pane_container}' ]; then false; \
    else ps -o state=,pidns=,comm= -t '#{pane_tty}' \
    | awk -v h=\"$(ps -o pidns= -p $$ | tr -d ' ')\" '$2==h {print $1\" \"$3}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'; fi"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

#vim keys
set-window-option -g mode-keys vi

#enable tmux continuum
#set -g @continuum-restore 'on'

# tmux plugin manager path - should always be kept at the bottom
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'dracula/tmux'
set -g @dracula-show-battery false
set -g @dracula-show-network false
set -g @dracula-show-weather false
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-military-time true
set -g @dracula-show-left-icon session
set -g @dracula-day-month true
set -g @dracula-left-icon-padding 0
set -g @dracula-show-fahrenheit false

set -g @plugin 'tmux-plugins/tmux-sessionist'

# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run -b '~/.tmux/plugins/tpm/tpm'

# The same three, forced onto the host. From a container pane these stay out
# here; the directory is translated back through the container's bind mounts, so
# a shell in the container's apps folder opens in the host side of that mount
# rather than wherever the pane was before the container was entered.
# C is taken by tmux-sessionist, hence N for the window.
bind '\' run-shell "~/.dotfiles/tmux/docker-split -H"
bind '_' run-shell "~/.dotfiles/tmux/docker-split -V"
bind 'N' run-shell "~/.dotfiles/tmux/docker-split -W"
