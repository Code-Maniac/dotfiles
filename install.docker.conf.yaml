# Pared-down config for running inside the SDKZ docker image.
#
# ./install picks this up automatically when SDKZ_IMAGE_VERSION is set. Command
# line tools and their config only. Deliberately left out of here, and why:
#
#   rust           - no toolchain, and nothing cargo-installed. bat and ripgrep
#                    come from the package manager instead; note that on
#                    debian/ubuntu bat's binary is called batcat.
#   GUI            - kitty, fonts, gnome-tweak-tool, spotify: no display to use
#                    them on beyond the simulator's own VNC session.
#   host installs  - docker, repo, kernel headers/devel, yocto site.conf. The
#                    container is not the machine these belong on.
#   gen-ssh-keys   - the pipeline mounts keys in at /home/user/.ssh; generating a
#                    throwaway pair in a container that gets deleted is pointless.
#   ~/.clang-format - the image puts one at /home/user/C4.3_firmware for parent
#                    discovery. A file in ~ would be found for anything under
#                    /home/user without a closer one, so firmware formatting is
#                    left to the image.
#   wakatime       - decrypting the key is interactive.
#   language servers, nvim plugin sync - not command line tools, and AstroNvim
#                    bootstraps its plugins on first launch anyway.
#
# omnipkg's "upgrade" is skipped too: a dist-upgrade inside a container is churn
# that the next docker run throws away.

- defaults:
    link:
        relink: true
        force: true

- clean: ['~']

- create:
    - ~/.antigen
    - ~/.zsh
    - ~/.config
    - ~/.config/clangd
    - ~/.tmux
    - ~/.tmux/plugins
    - ~/.vim/undo-history
    - ~/.local/share/nvim/backup//

- omnipkg:
  - update
  - install: [
    zsh,
    tmux,
    vim,
    neovim,
    git,
    curl,
    fzf,
    ripgrep,
    bat,
    # git/gitconfig sets core.pager to it, and git fails outright rather than
    # falling back when the pager is missing.
    git-delta,
    less,
    # bridges the tmux socket over TCP where it cannot be bind mounted
    socat,
    tree-sitter-cli,
    # ~/.claude is bind mounted in, so the statusline set in settings.json runs
    # in here too, and it parses claude's json with jq. Without it the statusline
    # fails on every render in the container while working fine on the host.
    jq,
    # nvim-dap talks DAP, and gdb only serves DAP when it was built with python -
    # the `dap` interpreter is implemented in python, so a gdb configured
    # --without-python reports "Interpreter `dap' unrecognized" no matter what
    # else it can do. That rules out the Zephyr SDK's arm-zephyr-eabi-gdb. Its -py
    # sibling wants libpython3.12, which ubuntu 26.04 does not package -
    # install-scripts/install-libpython312.sh in the sudo section supplies it.
    #
    # vim/astronvim/lua/plugins/dap.lua's gdb_remote adapter prefers that SDK
    # gdb-py, and falls back to gdb-multiarch: python built in, knows armv7e-m.
    # Not in the sdkz image, so without this target debugging over LinkServer
    # has nothing to fall back to whenever the SDK gdb cannot run.
    gdb-multiarch,
    # The image does ship this one, and dap.lua's plain `gdb` adapter needs it
    # for native_sim and host binaries. Listed so the dependency is explicit
    # rather than inherited by luck.
    gdb,
    # nvim-dap-cortex-debug runs cortex-debug's debug adapter under node, which is
    # what makes a project's .vscode/launch.json cortex-debug entries work in nvim.
    # The adapter itself comes from mason (Open VSX), installed on first launch.
    nodejs,
    # zshrc sources /usr/share/autojump/autojump.sh unconditionally on debian
    # based systems, so this is needed or every shell starts with an error.
    { dnf: autojump-zsh, else: autojump }]

- shell:
    # zshrc sources this directly - without it the shell is unusable.
    - [curl -L git.io/antigen > ~/.antigen/antigen.zsh, Installing antigen]
    # The pyOCD debug configurations target mimxrt1166cvm5a, which comes from NXP's
    # CMSIS pack rather than being built into pyOCD. The pack cache is per user, so
    # this runs here rather than under sudo. Idempotent.
    - [install-scripts/install-pyocd-rt1166-pack.sh, Installing the pyOCD RT1166 pack]
    # nvim-dap's python debugging needs debugpy, and mason cannot install it here:
    # it builds debugpy a venv of its own, and the image's python has no ensurepip.
    # So it goes into the python3 on PATH instead - /opt/venv, owned by the user
    # and the one west runs under - and dap.lua runs `python3 -m debugpy.adapter`.
    # It is in the container's own filesystem, so a recreated container needs
    # this again. Idempotent.
    - [python3 -m pip install --quiet debugpy, Installing debugpy]

- sudo:
  - shell:
    - [scripts/install_scripts, Installing scripts]
    # The image leaves the account on /bin/sh. Anything that honours the login
    # shell - su, a plain `docker exec` without a command - lands in sh without
    # this. It does not persist: /etc/passwd lives in the container's own
    # filesystem, so a recreated container needs the install run again.
    # SUDO_USER because the command itself runs as root.
    - ['u=${SUDO_USER:-$(id -un)}; [ "$(getent passwd "$u" | cut -d: -f7)" = "$(command -v zsh)" ] || chsh -s "$(command -v zsh)" "$u"', Set the login shell to zsh]
    # The image carries the LinkServer installer but not an installed LinkServer,
    # so nvim-dap's target debugging is dead in a fresh container until this runs.
    # Auto-accepts NXP's licence - see the header for exactly what that covers.
    # Idempotent, and a no-op anywhere the installer is absent.
    - [install-scripts/install-linkserver.sh, Installing LinkServer]
    # The Zephyr SDK's arm-zephyr-eabi-gdb-py needs libpython3.12 to start, and
    # dap.lua prefers it over gdb-multiarch for target debugging. From the
    # deadsnakes PPA, alongside the system python. Idempotent.
    - [install-scripts/install-libpython312.sh, Installing libpython3.12]

- link:
    ~/.zshrc: zsh/zshrc
    ~/.p10k.zsh: zsh/p10k.zsh
    ~/.zsh/completions: zsh/completions
    ~/.tmux.conf: tmux/tmux.conf
    ~/.tmux/plugins/tpm: tmux/tpm
    ~/.config/nvim: vim/astronvim
    ~/.gitconfig: git/gitconfig
    ~/.config/bat: bat
    ~/.config/clangd/config.yaml: clangd/config.yaml
    ~/.config/pycodestyle: config/pycodestyle
    # Claude Code keeps ~/.claude.json - the account record and onboarding state
    # - *beside* its config directory rather than inside it. Only ~/.claude is
    # bind mounted, so that file lands in the container's writable layer: the
    # credentials are shared but the account record is not, and Claude runs
    # onboarding and asks to log in again.
    #
    # zshrc exports CLAUDE_CONFIG_DIR to pull the whole config into the mount,
    # but that only reaches shells started after it, so a pane that was already
    # open still gets the login prompt. Linking the default path in as well
    # fixes it for every shell, and for anything that does not go through zsh.
    #
    # Source is outside the dotfiles directory, hence the ../ - the file belongs
    # to the host, this only points at it. Relative, like the statusline config
    # in install.conf.yaml, so the link resolves under both /home/nick and
    # /home/user.
    #
    # The /.dockerenv guard is what keeps this off the host. Reaching here at
    # all means SDKZ_IMAGE_VERSION was set, but `force: true` in the defaults
    # above would delete a real ~/.claude.json, and on the host that is the live
    # account record rather than a throwaway stub - too costly to leave to one
    # environment variable.
    ~/.claude.json:
      path: ../.claude/.claude.json
      relative: true
      if: '[ -f /.dockerenv ] && [ -e "$HOME/.claude/.claude.json" ]'
