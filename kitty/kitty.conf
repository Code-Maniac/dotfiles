include Dracula.conf

# These are family names, not filenames. The .ttf files are named "Hack Regular
# Nerd Font Complete Mono.ttf" but the family inside them is "Hack Nerd Font
# Mono" - fontconfig cannot match the filename form, and falls back to Noto Sans.
# `auto` picks the bold/italic faces out of the same family.
font_family Hack Nerd Font Mono
bold_font auto
italic_font auto
font_size 13
adjust_line_height 125%

cursor_blink_interval 0
window_padding_width 10
hide_window_decorations yes
remember_window_size no
initial_window_size no
initial_window_width 3600
initial_window_height 2400
enable_audio_bell no

detect_urls yes
open_url_with default

shell zsh
